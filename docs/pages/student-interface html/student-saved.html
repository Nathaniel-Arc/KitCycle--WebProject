<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Items | WMSU KitCycle</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/student-interface/student-dashboard.css">
    <link rel="stylesheet" href="../../css/marketplace.css">
    <script src="../../script/items-data.js"></script>
    <script src="../../script/ui-utils.js"></script>
    <script src="../../script/auth.js" defer></script>

    <!-- Instant Sidebar State Check -->
    <script>
        (function() {
            const isMinimized = localStorage.getItem('sidebarMinimized') === 'true';
            if (isMinimized) {
                document.documentElement.classList.add('sidebar-is-minimized');
            }
        })();
    </script>
    <style>
        .sidebar-is-minimized .sidebar { width: 80px !important; padding: 2rem 0.5rem !important; transition: none !important; }
        .sidebar-is-minimized .dashboard-content { margin-left: 80px !important; transition: none !important; }
        .sidebar-is-minimized .profile-info, .sidebar-is-minimized .sidebar-nav span, .sidebar-is-minimized .sidebar-logout span { display: none !important; }
        .sidebar-is-minimized .sidebar-nav a { justify-content: center !important; padding: 12px 0 !important; }
        .sidebar-is-minimized .sidebar-nav i { font-size: 1.2rem !important; margin: 0 !important; }
        .sidebar-is-minimized .sidebar-profile { justify-content: center !important; padding-bottom: 1.5rem !important; }
        
        /* Fix for marketplace grid in dashboard context */
        .marketplace-grid {
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            width: 100%;
            display: grid;
            gap: 24px;
        }
        
        .market-card {
            height: 100%;
        }

        .btn-save-mini.active i {
            color: #f43f5e;
            font-weight: 900;
        }
    </style>
</head>

<body>

    <header class="navbar">
        <div class="nav-left-group">
            <div class="sidebar-toggle" onclick="toggleSidebar()">
                <i class="fas fa-bars"></i>
            </div>
            <div class="logo">
                <img src="../../images/wmsulogo.png" alt="WMSU Logo" class="nav-logo-img">
                <div class="logo-text">WMSU<span>KitCycle</span></div>
            </div>
        </div>
        <div class="nav-right" style="display: flex; align-items: center; gap: 30px;">
            <ul class="nav-links" style="display: flex; list-style: none; gap: 25px; align-items: center; margin: 0;">
                <li><a href="student-dashboard.html">Home</a></li>
                <li><a href="../marketplace.html">WMSU Market</a></li>
                <li><a href="../howitworks.html">How It Works</a></li>
                <li><a href="../safety.html">Safety</a></li>
            </ul>
            <div class="auth-buttons">
                <!-- Injected by auth.js -->
            </div>
        </div>
    </header>

    <div class="dashboard-layout">

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-profile">
                <div class="profile-avatar"><img id="sidebarProfileImg" src="../../images/nash_profile.png" alt="Profile"></div>
                <div class="profile-info">
                    <h4 id="sidebarUserName">Nash Arciaga</h4>
                    <span id="sidebarUserRole">Student</span>
                </div>
            </div>

            <ul class="sidebar-nav">
                <li><a href="student-dashboard.html"><i class="fas fa-th-large"></i> <span>Dashboard</span></a></li>
                <li><a href="student-rentals.html"><i class="fas fa-box-open"></i> <span>Active Rentals</span></a></li>
                <li><a href="student-history.html"><i class="fas fa-history"></i> <span>Transaction History</span></a></li>
                <li>
                    <a href="student-messages.html" style="position: relative;">
                        <i class="fas fa-comments"></i> <span>Messages</span>
                        <span class="sidebar-badge">1</span>
                    </a>
                </li>
                <li class="active"><a href="student-saved.html"><i class="fas fa-heart"></i> <span>Saved Items</span></a></li>
                <li><a href="student-rating.html"><i class="fas fa-star"></i> <span>My Rating</span></a></li>
                <li><a href="student-listings.html"><i class="fas fa-list"></i> <span>My Listings</span></a></li>
                <li><a href="student-settings.html"><i class="fas fa-cog"></i> <span>Settings</span></a></li>
            </ul>

            <a href="javascript:void(0)" onclick="AuthSystem.confirmLogout(); return false;" class="sidebar-logout"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></a>
        </aside>

        <main class="dashboard-content" id="mainContent">

            <div class="dashboard-banner">
                <div>
                    <h2><i class="fas fa-heart"></i> Saved Items</h2>
                    <p>Gear you're interested in for future academic needs</p>
                </div>
            </div>

            <div class="marketplace-grid" id="savedItemsGrid">
                <!-- Items will be loaded here dynamically using Marketplace card style -->
            </div>

        </main>
    </div>

    <script src="../../script/student-data.js"></script>
    <script>
        function renderSavedItems() {
            const grid = document.getElementById('savedItemsGrid');
            const savedIds = JSON.parse(localStorage.getItem('student_saved_items') || '[]');
            
            if (savedIds.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 6rem 2rem; background: white; border-radius: 12px; border: 1px solid #e2e8f0;">
                        <i class="fas fa-heart-broken" style="font-size: 4rem; margin-bottom: 1.5rem; color: #cbd5e1;"></i>
                        <h3 style="color: #1e293b; margin-bottom: 0.5rem; font-size: 1.5rem;">No saved items yet</h3>
                        <p style="color: #64748b; margin-bottom: 2rem;">Browse the marketplace to find gear for your studies!</p>
                        <a href="../marketplace.html" style="display: inline-block; text-decoration: none; padding: 14px 30px; border-radius: 10px; background: #800000; color: white; font-weight: 700; box-shadow: 0 4px 15px rgba(128,0,0,0.2);">Browse WMSU Market</a>
                    </div>
                `;
                return;
            }

            grid.innerHTML = savedIds.map(identifier => {
                // Support both ID and Name for backward compatibility
                const item = KitCycleData.items.find(i => i.id === identifier || i.name === identifier);
                if (!item) return '';
                
                // Construct consistent card HTML matching marketplace.html
                return `
                    <div class="market-card">
                        <div class="market-img-container">
                            <span class="status-pill">${item.availability}</span>
                            <img src="${item.image}" alt="${item.name}">
                        </div>
                        <div class="market-info">
                            <div class="badge-row" style="margin-bottom: 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                                <span class="cat-badge ${item.categoryClass}" style="margin-bottom: 0;">${item.category}</span>
                                <span class="prop-tag personal" style="margin-left: 0;">PEER LISTING</span>
                            </div>
                            <h4>${item.name}</h4>
                            <div class="lender-info">
                                <span class="lender-name">${item.lender}</span>
                                <span class="verified-badge-small" title="Lender Verified"><i class="fas fa-check-circle"></i> Lender Verified</span>
                            </div>
                            <p class="location"><i class="fas fa-map-marker-alt"></i> ${item.location}</p>
                            <div class="rating-row">
                                <div class="rating-left">
                                    <span class="stars">★ ${item.rating}</span>
                                    <span class="rating-text">| ${item.rentals} Rentals</span>
                                </div>
                                <span style="font-size: 0.8rem; font-weight: 700; color: #4b5563;"><i class="fas fa-box"></i> Qty: ${item.quantity}</span>
                            </div>
                            <div class="card-footer">
                                <div class="price">
                                    ₱${item.price}
                                    <span class="per-day">per day</span>
                                </div>
                                <div class="item-actions">
                                    <button class="btn-remove-saved" title="Remove from saved" onclick="removeSavedItem('${item.id}', event)" style="width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid #fecaca; background: #fff1f2; color: #ef4444; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s;">
                                        <i class="fas fa-trash-alt"></i>
                                    </button>
                                    <button class="btn-rent-now" onclick="window.location.href='../item-details html/item-details.html?id=${item.id}'">Rent Now</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function removeSavedItem(id, event) {
            if(event) event.stopPropagation();
            let savedItems = JSON.parse(localStorage.getItem('student_saved_items') || '[]');
            savedItems = savedItems.filter(item => item !== id);
            localStorage.setItem('student_saved_items', JSON.stringify(savedItems));
            
            UIUtils.showToast("Item removed from Saved List", "info");
            window.dispatchEvent(new CustomEvent('savedItemsChanged'));
            renderSavedItems();
        }

        function toggleSidebar() {
            document.documentElement.classList.remove('sidebar-is-minimized');
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('mainContent');
            const isMinimized = sidebar.classList.toggle('minimized');
            mainContent.classList.toggle('expanded');
            localStorage.setItem('sidebarMinimized', isMinimized);
        }

        window.onload = function() {
            const isMinimized = localStorage.getItem('sidebarMinimized') === 'true';
            if (isMinimized) {
                const sidebar = document.getElementById('sidebar');
                const mainContent = document.getElementById('mainContent');
                if (sidebar) sidebar.classList.add('minimized');
                if (mainContent) mainContent.classList.add('expanded');
            }
            renderSavedItems();
        };
    </script>

</body>

</html>
